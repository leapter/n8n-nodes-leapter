name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

      # Node 22.14.0 bundles npm 10.9.2; `npm stage` landed in npm 11.15.0.
      - run: npm install --global npm@11.15.0

      # Stage-only trusted publisher: `npm publish` is not an allowed action.
      # This uploads the tarball and waits for a maintainer to approve it.
      - run: npm stage publish
        env:
          RELEASE_MODE: 'true'
